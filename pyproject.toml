[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechwm"
version = "0.6.0"
description = "Reproduction of log-spectrum spread-spectrum speech watermarking"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "soundfile", "PyYAML", "matplotlib"]

[project.optional-dependencies]
evaluation = ["pesq", "webrtcvad-wheels"]
channels = ["imageio-ffmpeg==0.6.0"]
test = ["pytest"]
deep = ["torch==2.14.1"]

[project.scripts]
speechwm = "speechwm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.setuptools.package-data]
speechwm = ["web/*.html"]
